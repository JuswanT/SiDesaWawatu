services:
  # ============================================
  # OpenSID Application (PHP + Apache)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensid-app
    restart: unless-stopped
    ports:
      - "6000:80"
    volumes:
      - ./desa:/var/www/html/desa
      - ./storage:/var/www/html/storage
      - ./backup_inkremental:/var/www/html/backup_inkremental
    environment:
      - CI_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - opensid-network

  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: opensid-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rahasia123}
      MYSQL_DATABASE: ${DB_DATABASE:-opensid}
      MYSQL_USER: ${DB_USERNAME:-opensid}
      MYSQL_PASSWORD: ${DB_PASSWORD:-opensid123}
    ports:
      - "3309:3306"
    volumes:
      - opensid-db-data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rahasia123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensid-network

  # ============================================
  # phpMyAdmin (Opsional - untuk kelola database)
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: opensid-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rahasia123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - opensid-network

volumes:
  opensid-db-data:
    driver: local

networks:
  opensid-network:
    driver: bridge
